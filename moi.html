
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chữ chạy</title>

    <style>
        body {
            background-color: #f0f0f0;
            text-align: center;
            padding-top: 100px;
        }

        .khung {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .chu {
            display: inline-block;
            font-size: 35px;
            font-weight: bold;
            color: red;
            animation: chay 5s linear infinite;
        }

        @keyframes chay {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(100vw);
            }
        }
    </style>
</head>

<body>

    <div class="khung">
        <div class="chu">
            ĐÁNH NHAU KHÔNG HƯỜNG
        </div>
    </div>

</body>
</html>
